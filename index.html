<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fffbf2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Europe '27" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Europe '27 • Fluid Travel</title>
    
    <!-- Mobile Diagnostic Error Catcher -->
    <script>
      window.__appFailed = false;
      window.__appMounted = false;
      window.onerror = function(msg, url, line, col, error) {
        console.error('Diagnostic error catcher:', msg, url, line, error);

        // Ignore harmless browser/resize/leaflet unmount noise
        var msgStr = String(msg || '');
        if (
          msgStr.includes('ResizeObserver') ||
          msgStr.includes('_leaflet_pos') ||
          msgStr.includes('Script error.')
        ) {
          return true;
        }

        // Only display fatal replacement screen if app has not yet mounted
        if (!window.__appMounted) {
          window.__appFailed = true;
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = 
              '<div style="min-height: 100vh; background: #fffbf2; color: #ef4444; padding: 24px; font-family: Inter, system-ui, sans-serif; box-sizing: border-box;">' +
                '<div style="max-width: 400px; margin: 0 auto; text-align: center; padding-top: 40px;">' +
                  '<h2 style="color: #1a1a1a; font-size: 20px; margin: 0 0 8px 0; font-weight: 800;">Europe \'27 Notice</h2>' +
                  '<p style="color: #57534e; font-size: 13px; line-height: 1.5; margin-bottom: 16px;">App cache revalidation in progress.</p>' +
                  '<div style="background: #fffdf8; border: 1px solid rgba(26,26,26,0.12); border-radius: 12px; padding: 12px; text-align: left; font-family: JetBrains Mono, monospace; font-size: 11px; color: #dc2626; word-break: break-all; margin-bottom: 20px;">' +
                    msgStr +
                  '</div>' +
                  '<button onclick="window.location.reload();" style="width: 100%; padding: 12px; background: #ff5e3a; color: white; font-weight: 800; border-radius: 8px; border: none; font-size: 14px; cursor: pointer;">' +
                    'Refresh App' +
                  '</button>' +
                '</div>' +
              '</div>';
          }
        }
        return false;
      };
    </script>
  </head>
  <body class="bg-[#fffbf2] text-[#1a1a1a] antialiased selection:bg-[#ff5e3a] selection:text-white">
    <div id="root">
      <!-- Fluid Travel warm cream splash screen -->
      <div style="min-height: 100vh; background: #fffbf2; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Inter, system-ui, sans-serif; text-align: center; padding: 24px;">
        <h1 style="font-family: Gaegu, cursive; color: #ff5e3a; font-size: 56px; font-weight: 700; margin: 0 0 6px 0; line-height: 0.9; transform: rotate(-2deg);">Europe '27</h1>
        <p style="font-family: JetBrains Mono, monospace; color: rgba(26,26,26,0.5); font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; margin: 0 0 28px 0;">Paris • Titlis • Lapland</p>
        <div style="width: 28px; height: 28px; border: 3px solid rgba(255, 94, 58, 0.2); border-top-color: #ff5e3a; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
