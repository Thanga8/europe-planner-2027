<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Europe '27" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Europe 2027 • Travel OS & Secure Vault</title>
    
    <!-- Mobile Diagnostic Error Catcher -->
    <script>
      window.__appFailed = false;
      window.__appMounted = false;
      window.onerror = function(msg, url, line, col, error) {
        console.error('Diagnostic error catcher:', msg, url, line, error);

        // Ignore harmless browser/resize/leaflet unmount noise
        var msgStr = String(msg || '');
        if (
          msgStr.includes('ResizeObserver') ||
          msgStr.includes('_leaflet_pos') ||
          msgStr.includes('Script error.')
        ) {
          return true;
        }

        // Only display fatal replacement screen if app has not yet mounted
        if (!window.__appMounted) {
          window.__appFailed = true;
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = 
              '<div style="min-height: 100vh; background: #f8fafc; color: #dc2626; padding: 24px; font-family: system-ui, -apple-system, sans-serif; box-sizing: border-box;">' +
                '<div style="max-width: 400px; margin: 0 auto; text-align: center; padding-top: 40px;">' +
                  '<div style="font-size: 40px; margin-bottom: 12px;">⚠️</div>' +
                  '<h2 style="color: #0f172a; font-size: 18px; margin: 0 0 8px 0; font-weight: bold;">Europe 2027 Notice</h2>' +
                  '<p style="color: #64748b; font-size: 13px; line-height: 1.5; margin-bottom: 16px;">App cache revalidation in progress.</p>' +
                  '<div style="background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; text-align: left; font-family: monospace; font-size: 11px; color: #ef4444; word-break: break-all; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">' +
                    msgStr +
                  '</div>' +
                  '<button onclick="window.location.reload();" style="width: 100%; padding: 12px; background: #0ea5e9; color: white; font-weight: bold; border-radius: 12px; border: none; font-size: 14px; cursor: pointer; box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);">' +
                    'Refresh App' +
                  '</button>' +
                '</div>' +
              '</div>';
          }
        }
        return false;
      };
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-sky-500 selection:text-white">
    <div id="root">
      <!-- Light Glassmorphic instant splash screen -->
      <div style="min-height: 100vh; background: linear-gradient(135deg, #f8fafc, #f0f9ff 50%, #eef2ff); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 80px; height: 80px; border-radius: 24px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.9); display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 25px -5px rgba(14, 165, 233, 0.15), 0 8px 10px -6px rgba(14, 165, 233, 0.1); margin-bottom: 20px;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(-45deg);">
            <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path>
          </svg>
        </div>
        <h1 style="color: #0f172a; font-size: 22px; font-weight: 800; margin: 0 0 4px 0; letter-spacing: -0.5px;">Europe '27</h1>
        <p style="color: #64748b; font-size: 13px; font-weight: 500; margin: 0 0 28px 0;">Paris • Titlis • Lapland</p>
        <div style="width: 32px; height: 32px; border: 3px solid rgba(14, 165, 233, 0.2); border-top-color: #0284c7; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
